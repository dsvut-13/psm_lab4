name: Linter and Type Check

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: uv sync
        
      - name: Run Ruff
        run: uv run ruff check . --ignore UP037,B008,E501
        
      - name: Run Mypy
        run: uv run mypy .