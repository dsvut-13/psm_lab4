[project]
name = "laba4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dsvut", email = "sasharostun0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.148.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
laba4 = "laba4:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]
